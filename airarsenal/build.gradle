buildscript {
    repositories {
        // jcenter() was shut down in 2024 — ForgeGradle 2.3 is now resolved from
        // Forge's own maven, which mirrors it, plus Maven Central as a fallback.
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://files.minecraftforge.net/maven" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = "com.airarsenal"
archivesBaseName = "airarsenal"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    // 14.23.5.2860 was pulled from Forge's public maven (archived/gated) after
    // their server migration; 14.23.5.2847 is a well-known, still-public build
    // for 1.12.2 and remains ABI-compatible for this mod.
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

repositories {
    maven { url = "https://maven.minecraftforge.net" }
    maven { url = "https://files.minecraftforge.net/maven" }
    mavenCentral()
}

dependencies {
    // No extra dependencies beyond Forge
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "airarsenal",
            "Specification-Vendor"    : "AirArsenal",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "AirArsenal",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
